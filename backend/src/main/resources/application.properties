spring.application.name=homecloud-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homecloud}
spring.datasource.username=${DB_USERNAME:homecloud}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
# Listen on every network interface so devices on the same LAN can reach HomeCloud.
# Override with SERVER_ADDRESS if you need a different bind address.
server.address=${SERVER_ADDRESS:0.0.0.0}

# File storage. This folder is created automatically inside the backend working directory.
homecloud.storage.location=${STORAGE_LOCATION:HomeCloudStorage}

# JWT configuration (Required in production)
homecloud.jwt.secret=${JWT_SECRET:}
homecloud.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

homecloud.security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,http://192.168.*,http://192.168.*:*,http://10.*,http://10.*:*,http://172.*,http://172.*:*,http://100.*,http://100.*:*,https://100.*,https://100.*:*,http://*.ts.net,http://*.ts.net:*,https://*.ts.net,https://*.ts.net:*}

# Multipart upload limits (for individual chunks / legacy single uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Resumable Large-File Transfers (Phase 3)
homecloud.transfers.max-file-size=${MAX_TRANSFER_FILE_SIZE:53687091200}
homecloud.transfers.default-chunk-size=${DEFAULT_CHUNK_SIZE:5242880}
homecloud.transfers.min-chunk-size=${MIN_CHUNK_SIZE:1048576}
homecloud.transfers.max-chunk-size=${MAX_CHUNK_SIZE:20971520}
homecloud.transfers.max-active-sessions-per-user=${MAX_ACTIVE_TRANSFER_SESSIONS:5}
homecloud.transfers.session-expiration-hours=${TRANSFER_SESSION_EXPIRATION_HOURS:24}
homecloud.transfers.cleanup-cron=${TRANSFER_CLEANUP_CRON:0 0 * * * *}

