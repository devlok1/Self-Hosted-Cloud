spring.application.name=homecloud-backend-test

# Use in-memory H2 database for testing with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:homecloud_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Secret (at least 32 characters)
homecloud.jwt.secret=TestSecretKeyForTestingJwtAuthentication1234567890
homecloud.jwt.expiration-ms=3600000

# Test Storage Location inside target folder
homecloud.storage.location=target/test-storage

# Test Transfer Settings
homecloud.transfers.max-file-size=53687091200
homecloud.transfers.default-chunk-size=1048576
homecloud.transfers.min-chunk-size=1
homecloud.transfers.max-chunk-size=10485760
homecloud.transfers.max-active-sessions-per-user=5
homecloud.transfers.session-expiration-hours=24
homecloud.transfers.cleanup-cron=0 0 * * * *

